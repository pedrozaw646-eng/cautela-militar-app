<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestão de Estoque - Reserva Admin</title>
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --accent-primary: #3b82f6; --text-main: #f8fafc; --text-sub: #94a3b8; --border-color: #334155; --danger: #ef4444; --success: #22c55e; --warning: #f59e0b; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; min-height: 100vh; }
        .header { padding-bottom: 12px; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); }
        .header h1 { font-size: 1.2rem; color: var(--accent-primary); }
        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .card h2 { font-size: 1.1rem; margin-bottom: 12px; color: var(--accent-primary); }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.8rem; margin-bottom: 4px; color: var(--text-sub); }
        input { width: 100%; padding: 12px; background-color: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 1rem; }
        button { padding: 10px 14px; color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; }
        .btn-add { width: 100%; background-color: var(--accent-primary); padding: 14px; font-size: 1rem; }
        .btn-success { background-color: var(--success); }
        .btn-danger { background-color: var(--danger); }
        .list-item { background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .list-item-title { font-weight: bold; font-size: 0.95rem; }
        .list-item-sub { font-size: 0.8rem; color: var(--text-sub); margin-top: 2px; }
        .actions { display: flex; gap: 6px; }
        #containerPendentes, #containerAtivas, #containerEstoque { display: flex; flex-direction: column; gap: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Gestão de Estoque e Aprovações</h1>
    </div>

    <!-- Adicionar Estoque -->
    <div class="card">
        <h2>Adicionar Item / Equipamento</h2>
        <form id="formAdicionarItem">
            <div class="form-group">
                <label>Nome do Item</label>
                <input type="text" id="nome" required placeholder="Ex: Capa de Colete">
            </div>
            <div class="form-group">
                <label>Código / Patrimônio</label>
                <input type="text" id="codigo" required placeholder="Ex: COL-100">
            </div>
            <div class="form-group">
                <label>Quantidade</label>
                <input type="number" id="qtd" required min="1" value="1">
            </div>
            <button type="submit" class="btn-add">Adicionar ao Estoque</button>
        </form>
    </div>

    <!-- Solicitações Pendentes -->
    <div class="card">
        <h2>Solicitações Pendentes</h2>
        <div id="containerPendentes"></div>
    </div>

    <!-- Cautelas Ativas -->
    <div class="card">
        <h2>Cautelas Ativas (Com o Militar)</h2>
        <div id="containerAtivas"></div>
    </div>

    <!-- Estoque Atual -->
    <div class="card">
        <h2>Estoque Cadastrado</h2>
        <div id="containerEstoque"></div>
    </div>

<script>
    function getDB() {
        return {
            itens: JSON.parse(localStorage.getItem('cautela_global_itens')) || [
                { id: 1, nome: 'Capa de Colete', codigo: 'COL-001', qtdTotal: 5, qtdDisponivel: 5 },
                { id: 2, nome: 'Colcha', codigo: 'COLCH-002', qtdTotal: 10, qtdDisponivel: 10 }
            ],
            solicitacoes: JSON.parse(localStorage.getItem('cautela_global_solicitacoes')) || []
        };
    }

    function saveDB(db) {
        localStorage.setItem('cautela_global_itens', JSON.stringify(db.itens));
        localStorage.setItem('cautela_global_solicitacoes', JSON.stringify(db.solicitacoes));
    }

    document.getElementById('formAdicionarItem').addEventListener('submit', (e) => {
        e.preventDefault();
        const nome = document.getElementById('nome').value.trim();
        const codigo = document.getElementById('codigo').value.trim();
        const qtdTotal = Number(document.getElementById('qtd').value) || 1;

        const { itens, solicitacoes } = getDB();
        const itemExistente = itens.find(i => i.codigo === codigo);

        if (itemExistente) {
            itemExistente.qtdTotal += qtdTotal;
            itemExistente.qtdDisponivel += qtdTotal;
        } else {
            itens.push({
                id: Date.now(),
                nome: nome,
                codigo: codigo,
                qtdTotal: qtdTotal,
                qtdDisponivel: qtdTotal
            });
        }

        saveDB({ itens, solicitacoes });
        e.target.reset();
        alert('Item adicionado ao estoque!');
        renderizar();
    });

    function aprovar(id) {
        const { itens, solicitacoes } = getDB();
        const sol = solicitacoes.find(s => s.id === id);
        const item = itens.find(i => i.id === sol.itemId);
        const qtd = sol.quantidade || 1;

        if (sol && item && item.qtdDisponivel >= qtd) {
            sol.status = 'APROVADA';
            sol.dataAprovacao = new Date().toLocaleString('pt-BR');
            item.qtdDisponivel -= qtd;
            item.qtdTotal -= qtd;
            saveDB({ itens, solicitacoes });
            renderizar();
        } else {
            alert('Estoque insuficiente para aprovar!');
        }
    }

    function devolver(id) {
        const { itens, solicitacoes } = getDB();
        const sol = solicitacoes.find(s => s.id === id);
        const item = itens.find(i => i.id === sol.itemId);
        const qtd = sol.quantidade || 1;

        if (sol) {
            sol.status = 'DEVOLVIDO';
            if (item) {
                item.qtdDisponivel += qtd;
                item.qtdTotal += qtd;
            }
            saveDB({ itens, solicitacoes });
            renderizar();
        }
    }

    function excluirItem(id) {
        const { itens, solicitacoes } = getDB();
        if (confirm('Deseja realmente remover este item do estoque?')) {
            const novosItens = itens.filter(i => i.id !== id);
            saveDB({ itens: novosItens, solicitacoes });
            renderizar();
        }
    }

    function renderizar() {
        const { itens, solicitacoes } = getDB();

        // Tabela Estoque
        const containerEstoque = document.getElementById('containerEstoque');
        containerEstoque.innerHTML = '';
        itens.forEach(i => {
            containerEstoque.innerHTML += `
                <div class="list-item">
                    <div>
                        <div class="list-item-title">${i.nome} [${i.codigo}]</div>
                        <div class="list-item-sub">Total: ${i.qtdTotal} | Disponível: <b>${i.qtdDisponivel}</b></div>
                    </div>
                    <button class="btn-danger" onclick="excluirItem(${i.id})">Excluir</button>
                </div>
            `;
        });

        // Pendentes
        const containerPendentes = document.getElementById('containerPendentes');
        containerPendentes.innerHTML = '';
        const pendentes = solicitacoes.filter(s => s.status === 'PENDENTE');
        if (pendentes.length === 0) {
            containerPendentes.innerHTML = '<p style="color: var(--text-sub); font-size: 0.9rem;">Nenhuma solicitação pendente.</p>';
        } else {
            pendentes.forEach(s => {
                containerPendentes.innerHTML += `
                    <div class="list-item">
                        <div>
                            <div class="list-item-title">${s.nomeGuerra} (${s.saram})</div>
                            <div class="list-item-sub">Item: ${s.itemNome} | <b>Qtd: ${s.quantidade || 1}</b> | ${s.data}</div>
                        </div>
                        <div class="actions">
                            <button class="btn-success" onclick="aprovar(${s.id})">Aprovar</button>
                        </div>
                    </div>
                `;
            });
        }

        // Ativas
        const containerAtivas = document.getElementById('containerAtivas');
        containerAtivas.innerHTML = '';
        const ativas = solicitacoes.filter(s => s.status === 'APROVADA');
        if (ativas.length === 0) {
            containerAtivas.innerHTML = '<p style="color: var(--text-sub); font-size: 0.9rem;">Nenhuma cautela ativa.</p>';
        } else {
            ativas.forEach(s => {
                containerAtivas.innerHTML += `
                    <div class="list-item">
                        <div>
                            <div class="list-item-title">${s.nomeGuerra} (${s.saram})</div>
                            <div class="list-item-sub">Item: ${s.itemNome} | <b>Qtd: ${s.quantidade || 1}</b></div>
                        </div>
                        <button class="btn-danger" onclick="devolver(${s.id})">Dar Baixa</button>
                    </div>
                `;
            });
        }
    }

    renderizar();
    setInterval(renderizar, 1000);
</script>
</body>
</html>
